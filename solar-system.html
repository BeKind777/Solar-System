<title>Solar System Orrery</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@600&display=swap">
<style>
/* Layout: rotatable 3D celestial view on the left, tabbed panel on the right; stacked vertically on narrow screens. Dark observatory-instrument style: amber = selected/rocket, teal = measurement/angles. */
:root{
  --bg:#080d1a; --panel:#0f1830; --panel2:#16244a; --line:#26365c; --line2:#1b2a4d;
  --fg:#dde6f7; --mute:#8a9bc0; --amber:#ffb347; --teal:#59d2e6; --rose:#ff7a90; --green:#7be0a4;
  --f-disp:'Noto Serif SC','Songti SC','STSong',serif;
  --f-body:'Noto Sans SC','PingFang SC','Microsoft YaHei',system-ui,-apple-system,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,'Noto Sans SC','PingFang SC',monospace;
  color-scheme:dark;
}
body{background:var(--bg);color:var(--fg);font:14px/1.55 var(--f-body);padding-inline:16px;padding-block:12px}
*{box-sizing:border-box}
.app{max-width:1500px;margin:0 auto}
header.top{display:flex;flex-wrap:wrap;gap:8px 16px;justify-content:space-between;align-items:flex-end;padding-block:2px 10px}
h1{font:600 28px/1.1 var(--f-disp);letter-spacing:.12em;margin:0}
.sub{color:var(--mute);font-size:12px;margin:5px 0 0}
.clock{text-align:right}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
#simDate{font-family:var(--f-mono);font-size:18px;font-weight:500;color:var(--fg)}
#simLocal{font-family:var(--f-mono);font-size:15px;color:var(--teal);margin-top:1px}
#simJD{font-family:var(--f-mono);font-size:11px;color:var(--mute)}
.timebar{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;padding:8px 10px;background:var(--panel);border:1px solid var(--line);border-radius:6px}
.timebar label{display:flex;align-items:center;gap:6px;color:var(--mute);font-size:12px;white-space:nowrap}
button,select,input[type=date],input[type=number],input[type=text]{font:inherit;font-size:13px;color:var(--fg);background:var(--panel2);border:1px solid var(--line);border-radius:5px;padding:6px 10px}
button{cursor:pointer}
button:hover{border-color:var(--amber)}
button.on{border-color:var(--amber);color:var(--amber)}
button.primary{background:var(--amber);color:#1a1203;border-color:var(--amber);font-weight:700}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--teal);outline-offset:1px}
input[type=number]{width:100%;font-family:var(--f-mono);min-width:0}
input[type=range]{width:100%;accent-color:var(--amber)}
.layout{display:grid;grid-template-columns:minmax(0,1fr);gap:12px;margin-top:12px}
@media(min-width:960px){.layout{grid-template-columns:minmax(0,1fr) clamp(480px,42vw,720px);align-items:start}}
.stage{position:relative;border:1px solid var(--line);border-radius:6px;background:#050912;overflow:hidden;min-width:0}
canvas{display:block;width:100%;height:64vh;min-height:360px;touch-action:none;cursor:grab}
@media(min-width:960px){canvas{height:calc(100vh - 230px);min-height:520px}}
.hud{position:absolute;left:10px;top:10px;max-width:calc(100% - 118px);padding:6px 9px;background:rgba(5,9,18,.66);border:1px solid var(--line2);border-radius:5px;font-size:12px;line-height:1.5;pointer-events:none}
.hud .am,.am{color:var(--amber)}
.hud .tl{color:var(--teal);font-size:11px}
.stagebtns{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:6px}
.stagebtns button{padding:5px 9px;font-size:12px;background:rgba(22,36,74,.85)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:8px;border-top:1px solid var(--line)}
.chips button{flex:0 0 auto;padding:5px 11px;font-size:12px}
.scbox{border:1px solid var(--line2);border-radius:6px;margin:0 0 10px;padding:0}
.scbox>summary,.scgrp>summary,.scadd>summary{cursor:pointer;padding:7px 10px;font-size:13px;color:var(--teal);list-style:none}
.scbox>summary::-webkit-details-marker,.scgrp>summary::-webkit-details-marker,.scadd>summary::-webkit-details-marker{display:none}
.scbox>summary::before,.scgrp>summary::before,.scadd>summary::before{content:'▸ ';color:var(--mute)}
.scbox[open]>summary::before,.scgrp[open]>summary::before,.scadd[open]>summary::before{content:'▾ '}
.scgrp{border-top:1px solid var(--line)}.scgrp>summary{color:var(--fg)}
.scadd{border-top:1px solid var(--line);padding:0 10px 10px}
.scrow{display:flex;justify-content:space-between;gap:8px;width:100%;text-align:left;border:0;border-radius:0;background:transparent;padding:6px 14px;font-size:12.5px}
.scrow:hover{background:rgba(89,210,230,.08)}.scrow.on{color:var(--amber);background:rgba(255,179,71,.09)}
.scrow span:last-child{font-family:var(--f-mono);font-size:11px;color:var(--mute);white-space:nowrap}
input[type=text]{width:100%;min-width:0}
.mono{font-family:var(--f-mono);font-size:12px}
.st-ok{color:var(--green)}.st-hard{color:var(--amber)}.st-no{color:var(--mute)}.st-warn{color:var(--rose)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;min-width:0}
@media(min-width:960px){.panel{max-height:calc(100vh - 230px);overflow:auto}}
.tabs{display:flex;border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);background:var(--panel);z-index:2}
.tabs{overflow-x:auto}
.tabs button{flex:1 0 auto;white-space:nowrap;border:0;border-radius:0;background:transparent;padding:10px 12px;color:var(--mute);border-bottom:2px solid transparent}
.tabs button.on{color:var(--amber);border-bottom-color:var(--amber)}
.pane{display:none;padding:12px 14px 16px}
.pane.on{display:block}
h3{font:600 18px/1.3 var(--f-disp);margin:0 0 6px;letter-spacing:.05em}
h3 small{font:400 12px var(--f-body);color:var(--mute);margin-left:8px;letter-spacing:0}
h4{font-size:13px;margin:14px 0 6px;color:var(--teal);letter-spacing:.06em}
fieldset{border:1px solid var(--line2);border-radius:6px;margin:0 0 12px;padding:8px 10px 10px;min-width:0}
legend{padding:0 6px;color:var(--teal);font-size:12px;letter-spacing:.08em}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.row.sp{justify-content:space-between}
.checks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 10px}
.checks label,.radios label{display:flex;gap:6px;align-items:center;font-size:13px}
.radios{display:flex;flex-wrap:wrap;gap:6px 14px}
input[type=checkbox],input[type=radio]{accent-color:var(--amber);width:16px;height:16px}
dl{margin:0}
.kv{display:grid;grid-template-columns:minmax(0,9.4em) minmax(0,1fr);gap:4px 10px;padding:5px 0;border-bottom:1px solid var(--line2)}
dt{color:var(--mute);font-size:13px}
dd{margin:0;font-family:var(--f-mono);font-size:13px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.note{color:var(--mute);font-size:12px;margin:8px 0 0}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:12px}
th,td{padding:5px 8px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line2);font-family:var(--f-mono);font-variant-numeric:tabular-nums}
th:first-child,td:first-child{text-align:left;font-family:var(--f-body)}
th{color:var(--mute);font-weight:500;font-family:var(--f-body)}
tr[data-moon]{cursor:pointer}
tr.on td{color:var(--amber)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.pt{display:grid;gap:6px}
.pt label{font-size:12px;color:var(--mute);display:block;margin-bottom:3px}
.xyz[hidden]{display:none!important}
.xyz{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:6px}
select{width:100%;min-width:0}
.card{border:1px solid var(--line2);border-radius:6px;padding:4px 12px 12px;margin-top:12px;background:rgba(8,13,26,.4)}
.btnrow{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.steps{margin:6px 0 0;padding-left:20px}
.steps li{margin:4px 0}
pre.formula{margin:6px 0 0;padding:10px;background:#070c18;border:1px solid var(--line2);border-radius:5px;font:12px/1.65 var(--f-mono);overflow-x:auto;white-space:pre;color:#cfe3ff}
.about p{margin:6px 0}
.about ul{margin:4px 0 8px;padding-left:20px}
.about li{margin:3px 0}
#skycv{display:block;width:100%;max-width:520px;aspect-ratio:1;height:auto!important;min-height:0!important;cursor:default;margin:8px auto 0;background:#050912;border:1px solid var(--line2);border-radius:6px}
#skychart{display:block;width:100%;height:330px;margin:4px 0 8px;background:#050912;border:1px solid var(--line2);border-radius:6px}
.why li{margin:7px 0}
.sw{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.langsw{display:flex;gap:4px;justify-content:flex-end;margin-bottom:6px}
.langsw button{padding:2px 10px;font-size:12px}
</style>

      <div class="pane" id="tab-scope">
        <h3>望远镜观测<small id="scName"></small></h3>
        <div id="scSpecs" class="note"></div>
        <details class="scbox" id="scBox"><summary>选择望远镜（点开展开列表）</summary>
          <div id="scList"></div>
          <details class="scadd"><summary>＋ 添加自己的望远镜</summary>
            <div class="grid2" style="margin-top:6px">
              <div class="pt"><label for="scaName">名称</label><input type="text" id="scaName" placeholder="我的望远镜"></div>
              <div class="pt"><label for="scaType">类型</label><select id="scaType"><option value="refr">折射</option><option value="refl">反射</option><option value="cat">折反射</option><option value="dob">多布森</option></select></div>
              <div class="pt"><label for="scaD">口径 (mm)</label><input type="number" id="scaD" value="100" min="20" max="2000"></div>
              <div class="pt"><label for="scaF">焦距 (mm)</label><input type="number" id="scaF" value="800" min="100" max="20000"></div>
            </div>
            <button type="button" id="scaBtn" style="margin-top:6px">加入列表并选用</button>
          </details>
        </details>
        <div class="grid2">
          <div class="pt"><label for="skyCond">天空条件</label>
            <select id="skyCond"><option value="0" selected>暗夜</option><option value="-1.5">郊区（极限星等 −1.5）</option><option value="-3.5">城区（极限星等 −3.5）</option></select></div>
          <div class="pt"><label>观测位置</label><div class="note" id="scopeLoc" style="margin:6px 0 0"></div></div>
        </div>
        <div id="locSlotScope"></div>
        <p class="note">位置和时区与「天空」页共用，日期跟随页面顶部。下面的表格会随所选望远镜变化。</p>
        <div id="scopeOut"></div>
      </div>

      <div class="pane" id="tab-lag">
        <h3>拉格朗日点<small>选两个天体，在三维图里标出 L1–L5</small></h3>
        <div class="grid2">
          <div class="pt"><label for="lagA">天体 1（大）</label><select id="lagA"></select></div>
          <div class="pt"><label for="lagB">天体 2（绕它运行）</label><select id="lagB"></select></div>
        </div>
        <div style="display:flex;gap:6px;flex-wrap:wrap;margin:8px 0">
          <button type="button" id="btnLagAll">看整条轨道（L3、L4、L5）</button>
          <button type="button" id="btnLagNear">放大看 L1、L2</button>
          <button type="button" id="btnLagSync">用「两点转移」页的选择</button>
        </div>
        <p class="note">图中红色菱形 L1–L3 不稳定，绿色菱形 L4、L5 稳定；紫色圆圈是天体 2 的 Hill 球，虚线圆是它的轨道，两条绿色虚线是等边三角形。可以拖动旋转，看 L 点都落在轨道面内。</p>
        <div id="lagOut"></div>
      </div>

      <div class="pane" id="tab-pair">
        <div class="grid2">
          <div class="pt">
            <label for="selA">起点</label>
            <select id="selA"></select>
            <div class="xyz" id="customA" hidden>
              <input type="number" id="inAx" value="1" step="0.1" aria-label="起点 x (AU)">
              <input type="number" id="inAy" value="0" step="0.1" aria-label="起点 y (AU)">
              <input type="number" id="inAz" value="0" step="0.1" aria-label="起点 z (AU)">
            </div>
          </div>
          <div class="pt">
            <label for="selB">终点</label>
            <select id="selB"></select>
            <div class="xyz" id="customB" hidden>
              <input type="number" id="inBx" value="-2" step="0.1" aria-label="终点 x (AU)">
              <input type="number" id="inBy" value="3" step="0.1" aria-label="终点 y (AU)">
              <input type="number" id="inBz" value="0.3" step="0.1" aria-label="终点 z (AU)">
            </div>
          </div>
        </div>
        <p class="note">自定义坐标是日心黄道直角坐标（单位 AU，x 轴指向春分点，z 轴指向黄道北极）。</p>
        <fieldset style="margin-top:10px">
          <legend>出发时刻</legend>
          <div class="radios">
            <label><input type="radio" name="depart" value="window" checked>下一个发射窗口</label>
            <label><input type="radio" name="depart" value="now">从当前日期出发</label>
          </div>
        </fieldset>
        <fieldset style="margin-top:10px">
          <legend>火箭 / 推进方式</legend>
          <div class="pt"><label for="rocketSel">选一款，下面的数字会自动填好（也可以手改）</label><select id="rocketSel"></select></div>
          <div id="rocketCard" class="note" style="margin-top:8px"></div>
        </fieldset>
        <div class="grid2">
          <div class="pt"><label for="inAlt">停泊轨道高度 km</label><input type="number" id="inAlt" value="200" min="0" step="50"></div>
          <div class="pt"><label for="inIsp">比冲 Isp（s）</label><input type="number" id="inIsp" value="450" min="50" step="10"></div>
          <div class="pt"><label for="inAcc">直飞恒加速度 m/s²</label><input type="number" id="inAcc" value="0.01" min="0.000001" step="0.005"></div>
          <div class="pt"><label for="inEps">结构系数 ε = 干质量 /（干质量+推进剂）</label><input type="number" id="inEps" value="0.1" min="0.01" max="0.95" step="0.01"></div>
          <div class="pt"><label for="inPay">有效载荷 kg</label><input type="number" id="inPay" value="1000" min="1" step="100"></div>
        </div>
        <p class="note">比冲越高越省推进剂；结构系数越小，单级能达到的 Δv 越大。选一款火箭后，计算结果最后会多一张「这枚火箭够不够用」的卡片。</p>
        <div class="btnrow"><button type="button" id="btnCalc" class="primary">计算</button><button type="button" id="btnSwap">起终点互换</button></div>
        <div id="pairOut"></div>
      </div>

      <div class="pane about" id="tab-about">
        <h3>怎么用</h3>
        <ul>
          <li>在画面上拖动旋转，双指或滚轮缩放。点击天体选中，已选中的再点一次会以它为中心并放大到其卫星系统。</li>
          <li>青色量角盘显示角度：围绕太阳时是黄经（0° 为春分点），围绕行星时是卫星轨道经度（0° 为赤道与黄道的升交点方向，地球则以春分点为 0°）。</li>
          <li>红线是行星自转轴，带圆点的一端是自转北极。</li>
          <li>「观测」页可在 30 款常见望远镜（肉眼、双筒、折射、反射、折反射，也可自己添加）中选择，按口径估算极限星等，判断每个天体现在能不能看到，并给出今晚的最佳时段、能看到的细节和观测建议。极限星等按口径 D 估算：11.5 + 5·log₁₀(D/80)，再减去天空条件的损失。</li>
          <li>「天空」页站在地面某个经纬度，给出月亮（或太阳、行星）的升起时刻、方位角和 30 天变化，并解释为什么每天不一样。</li>
          <li>「拉格朗日点」页选两个天体（如 太阳—地球、地球—月球），在三维图里标出 L1–L5、Hill 球和轨道，并列出各点位置和稳定性。</li>
          <li>「天体」页给出日心黄经、黄纬、距角、卫星轨道倾角与当前轨道经度；「两点转移」页计算任意两点的距离、火箭转移轨道和公式。</li>
        </ul>
        <h3>模型与精度</h3>
        <ul>
          <li>行星位置用 JPL 近似开普勒根数计算（适用 1800–2050 年），误差一般在数角分以内。地球取地月质心。</li>
          <li>自转轴方向取 IAU 极点坐标；黄赤交角取公布值。</li>
          <li>放大到画面里只剩一两颗天体（半径超过约 24 px）时，行星和月球会从圆点渐变为真实贴图球体：自转相位按 IAU 公式推算，昼夜明暗按太阳方位计算，土星环按真实环径和倾角绘制。地球、月球、火星的经度对得上；其余行星的云带和斑点只是示意，金星贴图为雷达地形而非可见的云顶。</li>
          <li>贴图来自 threex.planets 项目（MIT 许可，基于 Solar System Scope 与 NASA 公开影像），已压缩后嵌入页面。</li>
          <li>卫星的半长轴、周期、偏心率和倾角是真实值。月球用平均根数加主要摄动项，位置误差约 0.2°；升落时刻不含地形和大气折射变化，实际会差几分钟。其他卫星的当前相位只是示意。</li>
          <li>矮行星有谷神星、冥王星、妊神星、鸟神星和阋神星。根数取自公布值；后三颗运行极慢，当前位置按它们在星空中的大致方位校准，方向误差可达数度。冥王星在行星表中，点开会标注为矮行星。</li>
          <li><span class="sw" style="background:#d6c4a8"></span>小行星带、<span class="sw" style="background:#78e0be"></span>木星特洛伊（拉格朗日点 L4/L5，位于木星前后 60°）、<span class="sw" style="background:#8ca5ff"></span>柯伊伯带是按统计分布生成的示意粒子，已包含柯克伍德空隙和海王星 3:2 共振。粒子不是具体编号的小行星。</li>
          <li><span class="sw" style="background:#ffd27f"></span>哈雷彗星按真实轨道根数运行（1986-02-09 过近日点）。沿其轨道的黄色点带是流星体示意，地球穿过时产生猎户座和宝瓶座 η 流星雨。陨石是落到地面的流星体碎片，它们来自小行星带和彗星。</li>
        </ul>
        <h3>转移计算的假设</h3>
        <ul>
          <li>用瞬时点火的霍曼转移（半个椭圆，两次点火），发射窗口按真实星历搜索，使火箭到达时目标正好在终点。</li>
          <li>起终点在同一个行星系统内（如地球到月球）时，以该行星为中心天体计算；其他情况以太阳为中心。</li>
          <li>未计入引力辅助、低推力连续加速和中途修正。轨道面不重合时用「平面修正估计」给出额外 Δv，仅作参考，不是任务设计精度。</li>
        </ul>
      </div>
    </aside>
  </main>
</div>


</script>
<script type="text/html" id="html-en">
<div class="app">
  <header class="top">
    <div>
      <h1>Solar System Orrery</h1>

    <div class="clock"><div class="langsw" id="langSw"><button type="button" data-lang="zh">中文</button><button type="button" data-lang="en">EN</button></div><div id="simDate">--</div><div id="simLocal">--</div><div id="simJD">--</div></div>

  <section class="timebar" aria-label="Time controls">

        <option value="0.0416667">1 h/s</option>

  <main class="layout">

    <aside class="panel">

        <button type="button" class="on" data-tab="view">View</button>
        <button type="button" data-tab="body">Body</button>
        <button type="button" data-tab="sky">Sky</button>
        <button type="button" data-tab="scope">Observe</button>
        <button type="button" data-tab="lag">Lagrange</button>

        <button type="button" data-tab="about">About</button>
      </nav>

      <div class="pane on" id="tab-view">
        <fieldset>
          <legend>Viewing angle</legend>
          <div class="row sp"><label for="elev">Elevation (0° side - 90° top-down)</label><span class="mono" id="elevV">55°</span></div>
          <input type="range" id="elev" min="-90" max="90" step="1" value="55">
          <div class="row sp" style="margin-top:8px"><label for="azim">Azimuth</label><span class="mono" id="azimV">0°</span></div>
          <input type="range" id="azim" min="0" max="360" step="1" value="0">
          <p class="note">Drag the view to rotate, pinch or scroll to zoom, click a body to select it, click again to focus.</p>
        </fieldset>

        <fieldset>
          <legend>Distance scale</legend>
          <div class="radios">
            <label><input type="radio" name="mode" value="true" checked>True scale</label>
            <label><input type="radio" name="mode" value="sqrt">Compressed (√r)</label>
          </div>
          <div class="row" style="margin-top:8px"><label for="selRange">Sun view range</label>
            <select id="selRange" style="width:auto;flex:1">
              <option value="1.9">Inner solar system (to Mars)</option>
              <option value="3.6" selected>Including asteroid belt</option>
              <option value="6">To Jupiter</option>
              <option value="10.5">To Saturn</option>
              <option value="20.5">To Uranus</option>
              <option value="32">To Neptune</option>
              <option value="52">Including Kuiper belt</option>
              <option value="100">Including Eris (to 100 AU)</option>
            </select>
          </div>
          <p class="note">Compression only changes how distances are drawn; planet directions and angles stay true.</p>
        </fieldset>

        <fieldset>
          <legend>Moon orbit exaggeration</legend>
          <div class="row sp"><label for="moonScale">Moon distances scale up with planet radius</label><span class="mono" id="moonScaleV">×60</span></div>

          <li>The Scope tab lets you choose among 30 common telescopes (naked eye, binoculars, refractors, reflectors, catadioptrics, or add your own). It estimates the limiting magnitude from aperture, tells you whether each body can be seen right now, and gives the best time tonight, the details you can see, and observing tips. Limiting magnitude is estimated from aperture D as 11.5 + 5·log₁₀(D/80), minus the loss from sky conditions.</li>

        </ul>
        <h3>Model and accuracy</h3>
        <ul>
          <li>Planet positions use JPL's approximate Keplerian elements (valid for 1800-2050), with errors typically within a few arcminutes. Earth is taken as the Earth-Moon barycenter.</li>
          <li>Rotation axis directions use IAU pole coordinates; the obliquity uses the published value.</li>
          <li>When you zoom in until only one or two bodies remain on screen (radius above about 24 px), planets and the Moon fade from dots into textured spheres: rotation phase follows IAU formulas, day/night shading follows the Sun's direction, and Saturn's rings are drawn with the true ring radii and tilt. Longitudes line up for Earth, the Moon and Mars; the cloud bands and spots on the other planets are only illustrative, and the Venus texture is radar topography rather than the visible cloud tops.</li>
          <li>Textures come from the threex.planets project (MIT license), based on Solar System Scope and NASA public imagery, and are compressed and embedded in the page.</li>
          <li>Moons' semi-major axes, periods, eccentricities and inclinations are real values. The Moon uses mean elements plus the main perturbation terms, with a position error of about 0.2°; rise and set times ignore terrain and changes in atmospheric refraction, so actual times can differ by a few minutes. The current phase of the other moons is only illustrative.</li>
          <li>The dwarf planets are Ceres, Pluto, Haumea, Makemake and Eris. Elements are taken from published values; the last three move very slowly, so their current positions are calibrated to their approximate place in the sky, and the direction error can reach a few degrees. Pluto is in the planet list and is labeled as a dwarf planet when opened.</li>
          <li>The <span class="sw" style="background:#d6c4a8"></span>asteroid belt, the <span class="sw" style="background:#78e0be"></span>Jupiter Trojans (Lagrange points L4/L5, 60° ahead of and behind Jupiter) and the <span class="sw" style="background:#8ca5ff"></span>Kuiper belt are illustrative particles generated from statistical distributions, including the Kirkwood gaps and Neptune's 3:2 resonance. The particles are not specific numbered asteroids.</li>
          <li><span class="sw" style="background:#ffd27f"></span>Halley's Comet runs on its real orbital elements (perihelion on 1986-02-09). The band of yellow dots along its orbit is an illustrative meteoroid stream; when Earth crosses it, the Orionids and Eta Aquariids occur. Meteorites are fragments of meteoroids that land on the ground; they come from the asteroid belt and from comets.</li>
        </ul>
        <h3>Transfer calculation assumptions</h3>
        <ul>
          <li>It uses an impulsive-burn Hohmann transfer (a half ellipse, two burns), and the launch window is searched against the real ephemeris so that the target is exactly at the destination when the rocket arrives.</li>
          <li>When origin and destination are in the same planetary system (such as Earth to the Moon), that planet is the central body; otherwise the Sun is.</li>
          <li>Gravity assists, continuous low-thrust acceleration and mid-course corrections are not included. When the orbital planes do not coincide, a "plane-change estimate" gives the extra Δv; it is for reference only and not mission-design accuracy.</li>
        </ul>

/* ---------- 转移轨道 ---------- */
function hohmann(mu, r1, r2) {

  const dv1 = Math.abs(vt1 - vc1), dv2 = Math.abs(vc2 - vt2);

    T: Math.PI * Math.sqrt(a * a * a / mu), rp: Math.min(r1, r2), ra: Math.max(r1, r2) };
}
function hyperDv(mu, r, vinf) { return Math.sqrt(vinf * vinf + 2 * mu / r) - Math.sqrt(mu / r); }

function findWindow(relA, relB, jd0, tt, nA, nB) {
  const f = t => v3.ang(v3.mul(relA(jd0 + t), -1), relB(jd0 + t + tt));
  const sum = nA + nB;
  if (sum < 1e-9) return { wait: 0, syn: Infinity };
  let rel = Math.abs(nA - nB); if (rel < 1e-3 * sum) rel = sum;
  const syn = TAU / rel;
  const horizon = Math.min(syn * 1.15, 365.25 * 80);
  let N = Math.ceil(horizon / (0.0175 / sum)); N = Math.max(60, Math.min(N, 6000));
  const step = horizon / N, vals = [];
  for (let i = 0; i <= N; i++) vals.push(f(i * step));
  let idx = -1;
  for (let i = 0; i <= N; i++) {
    const a = i > 0 ? vals[i - 1] : Infinity, b = i < N ? vals[i + 1] : Infinity;
    const ok = vals[i] <= a && vals[i] <= b && vals[i] < (i === 0 ? 0.04 : 0.35);
    if (ok) { idx = i; break; }
  }
  if (idx < 0) { idx = 0; for (let i = 1; i <= N; i++) if (vals[i] < vals[idx]) idx = i; }
  let lo = Math.max(0, (idx - 1) * step), hi = Math.min(horizon, (idx + 1) * step);
  for (let k = 0; k < 60; k++) {
    const m1 = lo + (hi - lo) / 3, m2 = hi - (hi - lo) / 3;
    if (f(m1) < f(m2)) hi = m2; else lo = m1;

  return { wait: (lo + hi) / 2, syn };
}

  const jd = S.jd, T = (jd - J2000) / 36525, k = P.elemsAt(p, T), pos = FR.au[p.id], r = v3.len(pos);
  const lon = n360(Math.atan2(pos[1], pos[0]) * R2D), lat = Math.asin(pos[2] / r) * R2D;
  const v = Math.sqrt(P.MU_SUN * (2 / (r * AU) - 1 / (k.a * AU)));
  let h = kv('日心距离', f(r, 4) + ' AU（' + f(r * AU / 1e6, 1) + ' 百万 km）');
  h += kv('日心黄经 λ', f(lon, 2) + '°') + kv('日心黄纬 β', f(lat, 2) + '°');
  h += kv('轨道倾角 i', f(Math.abs(k.i * R2D), 3) + '°（相对黄道）') + (p.id === 'earth' ? '' : kv('升交点黄经 Ω', f(n360(k.Omdeg), 2) + '°'));
  h += kv('偏心率 e', f(k.e, 4)) + kv('近日点 / 远日点', f(k.a * (1 - k.e), 3) + ' / ' + f(k.a * (1 + k.e), 3) + ' AU');
  h += kv('公转周期', f(p.periodDays / 365.25, 2) + ' 年（' + f(p.periodDays, 1) + ' 天）') + kv('轨道速度', f(v, 2) + ' km/s');
  h += kv('自转轴倾角', f(p.obl, 2) + '°（赤道面相对轨道面）');
  if (p.id !== 'earth') {
    const e = FR.au.earth, rel = v3.sub(pos, e), d = v3.len(rel);
    const gl = n360(Math.atan2(rel[1], rel[0]) * R2D), gb = Math.asin(rel[2] / d) * R2D;
    const el = v3.ang(v3.mul(e, -1), rel) * R2D, ph = v3.ang(v3.mul(pos, -1), v3.mul(rel, -1)) * R2D;
    h += kv('距地球', f(d, 4) + ' AU（光行 ' + fmtLight(d * AU / P.C_KMS) + '）');
    h += kv('地心黄经 / 黄纬', f(gl, 2) + '° / ' + f(gb, 2) + '°');
    h += kv('太阳距角', f(el, 1) + '°') + kv('相位角（日-星-地）', f(ph, 1) + '°');
  }
  return h;
}
function moonTable(p) {
  if (!p.moons.length) return '<p class="note">' + p.name + '没有卫星。</p>';
  const showSep = p.id !== 'earth';
  let t = '<div class="scroll"><table><thead><tr><th>卫星</th><th>半长轴 km</th><th>周期 天</th><th>倾角</th><th>轨道经度</th><th>纬度</th>' + (showSep ? '<th>地球上看离行星</th>' : '') + '</tr></thead><tbody>';
  for (const m of p.moons) {
    const rel = FR.rel[m.id], a = P.moonAngles(m, rel);
    let sep = '';
    if (showSep) {
      const E = FR.au.earth, pp = v3.sub(FR.au[p.id], E), mm = v3.sub(v3.add(FR.au[p.id], v3.mul(rel, 1 / AU)), E);
      sep = '<td>' + f(v3.ang(pp, mm) * R2D * 3600, 1) + '″</td>';
    }
    t += '<tr class="' + (S.sel === m.id ? 'on' : '') + '" data-moon="' + m.id + '"><td>' + m.name + '</td><td>' + f(m.a, 0) + '</td><td>' + f(m.P, 3) + '</td><td>' + f(m.i, 2) + '°</td><td>' + f(a.lon, 1) + '°</td><td>' + f(a.lat, 2) + '°</td>' + sep + '</tr>';
  }
  const refTxt = p.id === 'earth' ? '月球的倾角、经度相对<b>黄道面</b>（0° = 春分点）' : '倾角、经度相对<b>' + p.name + '赤道面</b>（0° = 赤道与黄道的升交点方向）';
  return t + '</tbody></table></div><p class="note">' + refTxt + '。点击行可选中该卫星。</p>';
}
function moonPhase() {
  const e = FR.au.earth, m = FR.rel.moon, sunDir = v3.mul(e, -1);
  const elong = v3.ang(sunDir, m) * R2D;
  const east = n360(Math.atan2(m[1], m[0]) * R2D - Math.atan2(sunDir[1], sunDir[0]) * R2D);
  const k = (1 - Math.cos(elong * D2R)) / 2;
  const waxing = east < 180;
  let name;
  if (elong < 22.5) name = '新月'; else if (elong > 157.5) name = '满月';
  else if (elong < 67.5) name = waxing ? '蛾眉月' : '残月';
  else if (elong < 112.5) name = waxing ? '上弦月' : '下弦月';
  else name = waxing ? '盈凸月' : '亏凸月';
  return { name, k, elong, age: east / 360 * 29.53 };
}
function dwarfHTML(d) {
  const pos = FR.au[d.id], r = v3.len(pos);
  const lon = n360(Math.atan2(pos[1], pos[0]) * R2D), lat = Math.asin(pos[2] / r) * R2D;
  const v = Math.sqrt(P.MU_SUN * (2 / (r * AU) - 1 / (d.a * AU)));
  const rel = v3.sub(pos, FR.au.earth), dist = v3.len(rel);
  const gl = n360(Math.atan2(rel[1], rel[0]) * R2D), gb = Math.asin(rel[2] / dist) * R2D;
  let h = '<h3>' + d.name + '<small>矮行星</small></h3><dl>';
  h += kv('日心距离', f(r, 2) + ' AU（' + f(r * AU / 1e6, 0) + ' 百万 km）') + kv('日心黄经 λ / 黄纬 β', f(lon, 2) + '° / ' + f(lat, 2) + '°');
  h += kv('轨道倾角 i', f(d.i, 2) + '°') + kv('升交点黄经 Ω', f(d.Om, 2) + '°') + kv('偏心率 e', f(d.e, 4));
  h += kv('近日点 / 远日点', f(d.a * (1 - d.e), 2) + ' / ' + f(d.a * (1 + d.e), 2) + ' AU');
  h += kv('公转周期', f(d.periodYr, 1) + ' 年') + kv('轨道速度', f(v, 2) + ' km/s') + kv('平均半径', f(d.R, 0) + ' km');
  h += kv('距地球', f(dist, 2) + ' AU（光行 ' + fmtLight(dist * AU / P.C_KMS) + '）') + kv('地心黄经 / 黄纬', f(gl, 2) + '° / ' + f(gb, 2) + '°');
  return h + '</dl><p class="note">' + (d.id === 'ceres' ? '谷神星位于小行星带内，是带中最大的天体。' : '这颗矮行星运行极慢，位置按公布根数粗略定位，方向误差可达数度。') + '</p>';
}
function renderInfo() {
  const id = S.sel; let h = '';
  if (PLI[id]) {
    const p = PLI[id];
    h = '<h3>' + p.name + (p.dwarf ? '<small>矮行星</small>' : '') + '</h3><dl>' + planetRows(p) + '</dl><h4>卫星</h4>' + moonTable(p);
    if (id === 'earth') { const ph = moonPhase(); h += '<dl>' + kv('月相', ph.name + '（受照 ' + f(ph.k * 100, 0) + '%，月龄约 ' + f(ph.age, 1) + ' 天）') + kv('月-地-日夹角', f(ph.elong, 1) + '°') + '</dl>'; }
  } else if (MLI[id]) {
    const m = MLI[id], rel = FR.rel[id], a = P.moonAngles(m, rel), p = PLI[m.par];
    h = '<h3>' + m.name + '<small>' + p.name + '的卫星</small></h3><dl>';
    h += kv('距' + p.name, f(v3.len(rel), 0) + ' km') + kv('半长轴 a / 偏心率 e', f(m.a, 0) + ' km / ' + f(m.e, 4));
    h += kv('轨道周期', f(m.P, 3) + ' 天') + kv('轨道倾角', f(m.i, 2) + '°（相对' + (m.frame === 'ecl' ? '黄道' : p.name + '赤道') + '）');
    h += kv('轨道经度 / 纬度', f(a.lon, 2) + '° / ' + f(a.lat, 2) + '°') + kv('平均半径', f(m.R, 1) + ' km');
    h += kv('轨道速度（圆轨道）', f(Math.sqrt(p.mu / m.a), 3) + ' km/s');
    if (m.i > 90) h += kv('运行方向', '逆行');
    h += '</dl>';
    if (id === 'moon') { const ph = moonPhase(); h += '<dl>' + kv('月相', ph.name + '（受照 ' + f(ph.k * 100, 0) + '%）') + kv('月龄', '约 ' + f(ph.age, 1) + ' 天') + '</dl>'; }
    h += '<p class="note">除月球外，其他卫星的轨道半径、周期、倾角为真实值，当前相位仅为示意。</p>';
  } else if (DLI[id]) {
    h = dwarfHTML(DLI[id]);
  } else if (id === 'sun') {
    h = '<h3>太阳</h3><dl>' + kv('半径', '695,700 km') + kv('GM', '1.327×10¹¹ km³/s²') + kv('到地球', f(v3.len(FR.au.earth), 4) + ' AU') + kv('地心黄经', f(n360(Math.atan2(-FR.au.earth[1], -FR.au.earth[0]) * R2D), 2) + '°') + '</dl>';
  } else {
    const hp = FR.au.halley, r = v3.len(hp), H0 = P.HALLEY;
    const lon = n360(Math.atan2(hp[1], hp[0]) * R2D), lat = Math.asin(hp[2] / r) * R2D;
    const v = Math.sqrt(P.MU_SUN * (2 / (r * AU) - 1 / (H0.a * AU)));
    h = '<h3>哈雷彗星<small>1P/Halley</small></h3><dl>' + kv('日心距离', f(r, 2) + ' AU') + kv('日心黄经 / 黄纬', f(lon, 1) + '° / ' + f(lat, 1) + '°');
    h += kv('轨道倾角', f(H0.i * R2D, 2) + '°（逆行）') + kv('偏心率', f(H0.e, 5)) + kv('近日点 / 远日点', f(H0.a * (1 - H0.e), 3) + ' / ' + f(H0.a * (1 + H0.e), 2) + ' AU');
    h += kv('周期', '约 75.3 年') + kv('轨道速度', f(v, 2) + ' km/s') + kv('上次 / 下次近日点', '1986-02-09 / 2061-07 前后') + '</dl>';
    h += '<p class="note">黄色点带为沿哈雷轨道分布的流星体（示意），地球穿过时形成猎户座流星雨与宝瓶座 η 流星雨。</p>';
  }
  $('bodyInfo').innerHTML = h;
}
$('bodyInfo').addEventListener('click', e => {

/* ---------------- 顶部/HUD ---------------- */
function angleReadout() {
  const s = S.sel, jd = S.jd; if (s === S.focus) return '';
  let v, lab;
  if (MLI[s] && MLI[s].par === S.focus) { const a = P.moonAngles(MLI[s], FR.rel[s]); return '轨道经度 ' + f(a.lon, 1) + '° · 纬度 ' + f(a.lat, 1) + '°'; }
  const from = FR.au[S.focus] || [0, 0, 0], to = FR.au[s]; if (!to) return '';
  v = v3.sub(to, from); const d = v3.len(v); if (d < 1e-12) return '';
  return '黄经 ' + f(n360(Math.atan2(v[1], v[0]) * R2D), 1) + '° · 黄纬 ' + f(Math.asin(v[2] / d) * R2D, 1) + '° · 距离 ' + (d >= 0.01 ? f(d, 3) + ' AU' : f(d * AU, 0) + ' km');
}
let statusLast = 0;
function updateHud(now) {
  if (now - statusLast < (S.rate < 0.001 ? 50 : 160)) return; statusLast = now;
  $('simDate').textContent = fmtDateSec(S.jd);
  $('simJD').textContent = 'JD ' + f(S.jd, 4);
  { const q = skyIn(), d = P.jdToDate(S.jd + q.tz / 24), z = n => String(n).padStart(2, '0');
    const nm = CITY ? CITY[0] : '自定义位置', ab = CITY && !CITY[5] && !(CITY[4] === -10) ? (q.tz === CITY[4] ? '标准时' : '夏令时') : '';
    $('simLocal').textContent = nm + ' ' + d.getUTCFullYear() + '-' + z(d.getUTCMonth() + 1) + '-' + z(d.getUTCDate()) + ' ' + z(d.getUTCHours()) + ':' + z(d.getUTCMinutes()) + ':' + z(d.getUTCSeconds()) + ' UTC' + (q.tz >= 0 ? '+' : '−') + Math.abs(q.tz) + (ab ? ' ' + ab : ''); }
  const ang = angleReadout();
  let h = '<b>' + nameOf(S.focus) + '</b> 为中心 · 选中 <b class="am">' + nameOf(S.sel) + '</b>' + (ang ? '<br>' + nameOf(S.sel) + ' 相对' + nameOf(S.focus) + '：' + ang : '');
  if (S.show.ring) h += '<br><span class="tl">量角盘 R=' + f(ringInfo.R, ringInfo.R < 1 ? 2 : 0) + (S.mode === 'true' ? ' AU' : '') + ' · ' + ringInfo.lab + '</span>';
  if (S.plan && S.pairOn) {
    const pl = S.plan, el = clamp(S.jd - pl.tL, 0, pl.tt), rel = pl.relAt(S.jd);
    const tp = pl.tc ? pl.relAt(pl.arrival) : pl.relB(S.jd);
    const distT = v3.len(v3.sub(tp, rel));
    const sp = pl.speedAt(S.jd);
    const state = S.jd < pl.tL ? '等待发射（' + fmtDur(pl.tL - S.jd) + '后）' : S.jd >= pl.arrival ? '已到达' : '飞行中 ' + f(el / pl.tt * 100, 0) + '%';
    h += '<br><span class="am">火箭：' + state + ' · 速度 ' + f(sp, 2) + ' km/s（相对' + (pl.center === 'sun' ? '太阳' : nameOf(pl.center)) + '）· 距目标 ' + (pl.center === 'sun' ? f(distT / AU, 3) + ' AU' : f(distT, 0) + ' km') + '</span>';
  }
  $('hud').innerHTML = h;
  if (document.activeElement !== $('inDate')) { const d = P.jdToDate(S.jd); $('inDate').value = d.toISOString().slice(0, 10); }
  $('elev').value = Math.round(S.pitch * R2D); $('elevV').textContent = Math.round(S.pitch * R2D) + '°';
  let az = Math.round(((S.yaw * R2D) % 360 + 360) % 360); $('azim').value = az; $('azimV').textContent = az + '°';
}
let infoLast = 0;
function updateInfo(now) {
  if (now - infoLast <= 300) return; infoLast = now;
  computeObs();
  if ($('tab-scope').classList.contains('on')) {
    const q = skyIn(), key = localDayStart(S.jd, q.tz).toFixed(2) + '|' + q.lat + '|' + q.lon + '|' + q.tz + '|' + $('skyCond').value + '|' + SC.id;
    if (key !== scopeKey) renderScope();
  }
  if (S.lagOn) lagInfo();
  if ($('tab-body').classList.contains('on')) renderInfo();
  if ($('tab-sky').classList.contains('on')) {
    const q = skyIn();
    const key = localDayStart(S.jd, q.tz).toFixed(2) + '|' + q.lat + '|' + q.lon + '|' + q.tz + '|' + q.body;
    if (key !== skyKey) computeSky(); else renderSkyOut();
  }
}

  const note = LAG_NOTES[L.A + '|' + L.B];
  h += '<h4>Examples in this system</h4><p class="note" style="margin-top:0">' + (note || 'L1-L3 are unstable saddle points, so spacecraft need small thrusts to maintain a "halo orbit"; L4 and L5 are stable, and as long as μ is small enough, small bodies can librate around them for a long time (tadpole orbits), so these regions collect "Trojan" bodies.') + '</p>';
  h += '<h4>Formulas</h4><ul class="steps">'
    + '<li>In the rotating frame (origin at the barycenter, unit = d, angular velocity ω = √(G(m₁+m₂)/d³)), M₁ is at (−μ, 0) and M₂ at (1−μ, 0).</li>'
    + '<li>L1, L2, L3 satisfy the collinear equation:<br><span class="mono">x − (1−μ)(x+μ)/|x+μ|³ − μ(x−1+μ)/|x−1+μ|³ = 0</span>; there is one root between M₁ and M₂, one beyond M₂, and one beyond M₁, found by bisection.</li>'
    + '<li>Approximations: <span class="mono">r(L1,L2) ≈ d·(μ/3)^(1/3)</span> (from M₂), <span class="mono">L3 ≈ −d(1 + 5μ/12)</span>.</li>'
    + '<li>L4 and L5 form equilateral triangles with M₁ and M₂: <span class="mono">(x, y) = (½ − μ, ±√3/2)</span>.</li>'
    + '<li>Linear stability condition for L4/L5 (Routh): <span class="mono">μ &lt; ½(1 − √(69)/9) ≈ 0.03852</span>, i.e. m₁/m₂ &gt; 24.96.</li>'
    + '<li>Point positions in the view are set by the true positions and velocities of the two bodies at the current time: the x axis runs along M₁→M₂ and the z axis along the relative orbital angular momentum, and the circular restricted three-body solution is rotated into that frame (orbital eccentricity is ignored).</li></ul>';
  setLag(h);
}
let lagHtml = '';
function setLag(h) { if (h !== lagHtml) { lagHtml = h; $('lagOut').innerHTML = h; } }
function lagUpdate() {
  LG = lagCalc(S.jd);
  if (LG && !LG.err) { S.lagAB = [LG.A, LG.B]; }
}
(function buildLagSelects() {
  const opt = (v, t) => '<option value="' + v + '">' + t + '</option>';
  let h = '<optgroup label="Stars and planets">' + opt('sun', 'Sun') + PLANETS.map(p => opt(p.id, p.name)).join('') + '</optgroup>';
  h += '<optgroup label="Dwarf planets">' + DWARFS.map(d => opt(d.id, d.name)).join('') + '</optgroup>';
  h += '<optgroup label="Moons">' + MOONS.map(m => opt(m.id, m.name + ' (' + PLI[m.par].name + ')')).join('') + '</optgroup>';
  $('lagA').innerHTML = h; $('lagB').innerHTML = h; $('lagA').value = 'sun'; $('lagB').value = 'earth';
})();
['lagA', 'lagB'].forEach(id => $(id).addEventListener('change', () => { lagUpdate(); lagInfo(); lagFit('all'); }));
$('btnLagAll').onclick = () => { lagUpdate(); lagFit('all'); };
$('btnLagNear').onclick = () => { lagUpdate(); lagFit('near'); };
$('btnLagSync').onclick = () => {
  if (S.pair && S.pair.A && S.pair.B && S.pair.A.id && S.pair.B.id && /^[a-z]/.test(S.pair.A.id) && ($('lagA').querySelector('option[value=' + S.pair.A.id + ']')) && $('lagB').querySelector('option[value=' + S.pair.B.id + ']')) {
    $('lagA').value = S.pair.A.id; $('lagB').value = S.pair.B.id; lagUpdate(); lagInfo(); lagFit('all');
  }
};
$('lagOut').addEventListener('click', e => { const b = e.target.closest('.lagjump'); if (!b) return; $('lagA').value = b.dataset.a; $('lagB').value = b.dataset.b; lagUpdate(); lagInfo(); lagFit('all'); });

/* ---------------- Main loop ---------------- */
let last = performance.now();
function frame(now) {
  if (window.__gen !== MYGEN) return;
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  if (S.playing) S.jd += (S.rev ? -1 : 1) * S.rate * dt;
  draw(); updateHud(now); updateInfo(now);
  if ($('tab-sky').classList.contains('on')) drawSky();
  requestAnimationFrame(frame);
}
resize();
window.addEventListener('resize', () => { if (window.__gen === MYGEN) resize(); });
if (window.ResizeObserver) new ResizeObserver(() => resize()).observe(cv);

window.__app = { getState() {
  const tb = document.querySelector('.tabs button.on');
  let cityIdx = null; US_CITIES.forEach((g, gi) => g[1].forEach((c, ci) => { if (c === CITY) cityIdx = [gi, ci]; }));
  return { jd: S.jd, playing: S.playing, rate: S.rate, rev: S.rev, yaw: S.yaw, pitch: S.pitch, zoom: S.zoom, focus: S.focus, sel: S.sel, mode: S.mode,
    moonScale: S.moonScale, show: Object.assign({}, S.show), tab: tb ? tb.dataset.tab : 'view', scope: SC.id, userScopes: SCOPES.filter(x => x.g === 'user'),
    cityIdx, lat: $('skyLat').value, lon: $('skyLon').value, tz: $('skyTz').value, auto: $('skyAuto').checked, body: $('skyBody').value, cond: $('skyCond').value,
    lagA: $('lagA').value, lagB: $('lagB').value, depart: document.querySelector('input[name=depart]:checked').value, rocket: $('rocketSel').value,
    inAlt: $('inAlt').value, inIsp: $('inIsp').value, inAcc: $('inAcc').value, inEps: $('inEps').value, inPay: $('inPay').value, selA: $('selA').value, selB: $('selB').value };
} };
if (window.__carry) {
  const c = window.__carry; window.__carry = null;
  try {
    S.mode = c.mode; const mr = document.querySelector('input[name=mode][value=' + c.mode + ']'); if (mr) mr.checked = true;
    S.moonScale = c.moonScale; Object.assign(S.show, c.show);
    document.querySelectorAll('[data-show]').forEach(x => { if (x.dataset.show in S.show) x.checked = !!S.show[x.dataset.show]; });
    if (c.cityIdx) { CITY = US_CITIES[c.cityIdx[0]][1][c.cityIdx[1]]; } else CITY = null;
    $('skyLat').value = c.lat; $('skyLon').value = c.lon; $('skyAuto').checked = c.auto; $('skyTz').value = c.tz; $('skyBody').value = c.body; $('skyCond').value = c.cond;
    citySummary(); buildCityList();
    (c.userScopes || []).forEach(x => SCOPES.push(x)); SC = SCOPES.find(x => x.id === c.scope) || SC; buildScopeList();
    ['selA', 'selB'].forEach(id => { $(id).value = c[id]; }); toggleCustom();
    $('rocketSel').value = c.rocket; ['inAlt', 'inIsp', 'inAcc', 'inEps', 'inPay'].forEach(id => { $(id).value = c[id]; }); rocketCard();
    const dr = document.querySelector('input[name=depart][value=' + c.depart + ']'); if (dr) dr.checked = true;
    $('lagA').value = c.lagA; $('lagB').value = c.lagB;
    S.jd = c.jd; buildFrame();
    const tbtn = document.querySelector('.tabs button[data-tab=' + c.tab + ']'); if (tbtn) tbtn.click();
    S.rate = c.rate; S.rev = c.rev; $('btnRev').classList.toggle('on', S.rev); setPlay(c.playing);
    if ([...$('selRate').options].some(o => parseFloat(o.value) === c.rate)) $('selRate').value = [...$('selRate').options].find(o => parseFloat(o.value) === c.rate).value;
    S.yaw = c.yaw; S.pitch = c.pitch; S.zoom = c.zoom; S.focus = c.focus; S.sel = c.sel;
  } catch (e) { console.warn('state carry failed', e); }
}
$('moonScale').value = String(Math.round(Math.log10(S.moonScale) * 100)); $('moonScaleV').textContent = '×' + f(S.moonScale, 0);
buildFrame(); syncChips(); renderInfo(); toggleCustom();
requestAnimationFrame(frame);
})();

<script>
(function(){
var TITLES={zh:'太阳系仪',en:'Solar System Orrery'};
var lang='en';
try{var saved=localStorage.getItem('orrery-lang'); if(saved==='zh'||saved==='en') lang=saved; else if(/^zh/i.test((navigator.languages&&navigator.languages[0])||navigator.language||'')) lang='zh';}catch(e){}
function txt(id){return document.getElementById(id).textContent;}
function boot(l,carry){
  lang=l; try{localStorage.setItem('orrery-lang',l);}catch(e){}
  document.documentElement.lang=l==='zh'?'zh-CN':'en'; document.title=TITLES[l];
  var old=document.getElementById('bundle'); if(old) old.remove();
  window.__app=null; window.__carry=carry||null;
  document.getElementById('app').innerHTML=txt('html-'+l);
  document.querySelectorAll('#langSw button').forEach(function(b){b.classList.toggle('on',b.dataset.lang===l);});
  var s=document.createElement('script'); s.id='bundle'; s.textContent=txt('js-'+l); document.body.appendChild(s);
}
document.addEventListener('click',function(e){
  var b=e.target.closest&&e.target.closest('#langSw [data-lang]'); if(!b||b.dataset.lang===lang) return;
  var st=null; try{st=window.__app&&window.__app.getState();}catch(err){}
  boot(b.dataset.lang,st);
});
boot(lang,null);
})();
</script>
